name: Browser smoke checks (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Playwright desktop and mobile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install browsers and OS dependencies
        run: npx playwright install --with-deps chromium webkit
      - name: Build and test browser journeys
        run: npm run test:e2e
      - name: Upload debugging traces if browser checks fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 3
